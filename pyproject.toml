[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ctb-evals"
version = "1.3.0"
description = "Measure Claude on accountant-written month-end close benchmarks (FinBalance, APEX-Accounting): writing code vs answering directly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Emilio Molina Román" }]
keywords = ["evals", "llm", "accounting", "claude", "agents", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
agents = ["claude-agent-sdk>=0.2"]

[project.scripts]
ctb = "ctb_evals.cli:main"

[project.urls]
Methodology = "https://github.com/emiliomolinaroman/close-the-books-evals/blob/main/docs/methodology.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ctb_evals"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["team_outputs", "scaffold", "experiments/2026-11/original_scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ctb_evals"]
exclude = ["src/ctb_evals/agents/"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "claude_agent_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
